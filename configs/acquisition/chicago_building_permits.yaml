acquisition_workflow:
  dataset_id: chicago_building_permits
  dataset_label: Chicago Building Permits
  portal_page: https://data.cityofchicago.org/widgets/s7zd-na9a?mobile_redirect=true
  schema_version_reference: https://data.cityofchicago.org/api/views/ydr8-5enu/rows.pdf
  schema_references:
    - https://data.cityofchicago.org/widgets/s7zd-na9a?mobile_redirect=true
    - https://data.cityofchicago.org/api/views/ydr8-5enu/rows.pdf
  primary_event_timestamp_column: ISSUE_DATE
  update_cadence_documentation: Public Chicago Building Permits data is available through the city open-data portal, updated daily, and is batched daily in the benchmark by ISSUE_DATE.
  batch_unit: daily
  portal_workflow:
    - Open the official Chicago Building Permits data-portal page for the frozen benchmark window.
    - Export the full official CSV extract for the frozen benchmark window without prefiltering records before archival.
    - Save the exported raw file into the manual input directory using the exact expected name chicago_building_permits_{snapshot_id}.csv.
    - Save the matching official rows.pdf schema export alongside the snapshot manifests.
  raw_assets:
    - asset_id: chicago_building_permits_snapshot
      file_role: raw_file
      acquisition_mode: manual_portal
      source_reference: https://data.cityofchicago.org/widgets/s7zd-na9a?mobile_redirect=true
      local_name_template: chicago_building_permits_{snapshot_id}.csv
      manual_source_name_template: chicago_building_permits_{snapshot_id}.csv
      description: Frozen full official CSV snapshot exported from the Chicago Building Permits open-data portal.
  support_assets: []
