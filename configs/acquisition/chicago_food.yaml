acquisition_workflow:
  dataset_id: chicago_food
  dataset_label: Chicago Food
  portal_page: https://data.cityofchicago.org/Health-Human-Services/Food-Inspections/j8a4-a59k/about_data
  schema_version_reference: https://data.cityofchicago.org/api/views/j8a4-a59k/rows.pdf
  schema_references:
    - https://data.cityofchicago.org/api/views/j8a4-a59k/rows.pdf
  primary_event_timestamp_column: Inspection Date
  update_cadence_documentation: Public Chicago Food Inspections data is available through the city open-data portal and is batched weekly in the benchmark.
  batch_unit: weekly
  portal_workflow:
    - Open the Chicago Food Inspections open-data portal page and use the portal export workflow for the frozen snapshot window.
    - Export the raw CSV snapshot covering the frozen benchmark window.
    - Save the exported file into the manual input directory using the exact expected name chicago_food_{snapshot_id}.csv.
  raw_assets:
    - asset_id: chicago_food_snapshot
      file_role: raw_file
      acquisition_mode: manual_portal
      source_reference: https://data.cityofchicago.org/Health-Human-Services/Food-Inspections/j8a4-a59k/about_data
      local_name_template: chicago_food_{snapshot_id}.csv
      manual_source_name_template: chicago_food_{snapshot_id}.csv
      description: Frozen CSV snapshot exported from the Chicago Food open-data portal.
  support_assets: []
