[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dq-alert-benchmark"
version = "0.1.0"
description = "Reproducible benchmark for tabular data-quality alerting"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "dtl" }
]
dependencies = [
  "duckdb>=1.0.0",
  "numpy>=1.22",
  "pandas>=1.5",
  "pandera[pandas]>=0.30.1",
  "pydantic>=1.10,<2",
  "pyarrow>=12.0.0",
  "PyYAML>=6.0",
  "scipy>=1.9",
]

[project.optional-dependencies]
ml = [
  "scikit-learn>=1.1",
]
viz = [
  "matplotlib>=3.5",
  "seaborn>=0.12",
]
dev = [
  "pytest>=7.0",
]

[project.scripts]
dqbench-run-pilot = "dqbench.orchestration.run_experiment:main"
dqbench-download-snapshots = "dqbench.data.acquisition:main"
dqbench-write-snapshot-manifest = "dqbench.data.manifest:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
